name: Research Copilot production scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute due Pro research schedules
        env:
          RESEARCH_URL: ${{ vars.RESEARCH_API_URL }}
          RESEARCH_SECRET: ${{ secrets.SCANNER_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail

          test -n "$RESEARCH_URL"
          test -n "$RESEARCH_SECRET"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

          oidc_response="$(
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=research-production-verifier"
          )"
          oidc_token="$(echo "$oidc_response" | jq -er '.value')"
          test -n "$oidc_token"

          api_url="${RESEARCH_URL%/}/api/research-copilot/scheduler/run"
          response="$(
            curl --fail --silent --show-error --retry 2 --retry-delay 2 --max-time 840               -X POST               -H "Authorization: Bearer $oidc_token"               -H "X-Research-Copilot-Secret: $RESEARCH_SECRET"               -H "Accept: application/json"               "$api_url"
          )"

          echo "$response" | jq .
          echo "$response" | jq -e '
            (.scheduled | type == "number") and
            (.completed | type == "number") and
            (.failed | type == "number") and
            (.failed == 0)
          '
