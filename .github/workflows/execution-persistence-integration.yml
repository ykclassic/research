name: Execution Persistence PostgreSQL Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*execution*"
      - "backend/app/services/execution_persistence.py"
      - "backend/tests/test_execution_persistence_postgres.py"
      - ".github/workflows/execution-persistence-integration.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*execution*"
      - "backend/app/services/execution_persistence.py"
      - "backend/tests/test_execution_persistence_postgres.py"
      - ".github/workflows/execution-persistence-integration.yml"
  workflow_dispatch:

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: execution_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d execution_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXECUTION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/execution_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend and PostgreSQL driver
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "psycopg[binary]>=3.2,<4"
      - name: Apply proposed migration to disposable PostgreSQL
        working-directory: backend
        run: python -m pytest -q tests/test_execution_persistence_postgres.py
