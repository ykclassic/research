name: Production Market Data Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-market-data-verification
  cancel-in-progress: false

jobs:
  verify-production-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MARKET_API_BASE: https://research-76vr.onrender.com
      MARKET_SYMBOL: BTC/USD
      MARKET_FALLBACK_SYMBOL: AAPL
      MARKET_FALLBACK_TIMEFRAME: 1d
      MARKET_TIMEFRAME: 1h
      MARKET_ANALYSIS_LIMIT: 250
      ENHANCED_SIGNAL_SYMBOL: BTC/USDT
      ENHANCED_SIGNAL_LIMIT: 250
      MARKET_MAX_PROVIDER_AGE: 180
      MTF_MAX_EXTRA_AGE_SECONDS: 180
      GITHUB_OIDC_AUDIENCE: research-production-verifier
      RENDER_SERVICE_ID: srv-da6bkhgjo6nc73cg1big
      RENDER_DEPLOY_WAIT_TIMEOUT: 480
      RENDER_DEPLOY_POLL_INTERVAL: 10
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Synchronize production provider secrets to Render
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY}"
          test -n "${TWELVE_DATA_API_KEY}"
          test -n "${FINNHUB_API_KEY}"
          test -n "${ALPHA_VANTAGE_API_KEY}"
          update_render_env() {
            local key="$1"
            local value="$2"
            curl --fail-with-body --silent --show-error --request PUT \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Content-Type: application/json" \
              --data "$(python -c 'import json,sys; print(json.dumps({"value": sys.argv[1]}))' "$value")" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${key}" >/dev/null
            echo "Synchronized Render secret: ${key}"
          }
          update_render_env TWELVE_DATA_API_KEY "${TWELVE_DATA_API_KEY}"
          update_render_env FINNHUB_API_KEY "${FINNHUB_API_KEY}"
          update_render_env ALPHA_VANTAGE_API_KEY "${ALPHA_VANTAGE_API_KEY}"

      - name: Wait for matching Render deployment on push
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python backend/scripts/wait_for_render_deployment.py --commit "${GITHUB_SHA}" --trigger

      - name: Set expected deployment commit for push verification
        if: github.event_name == 'push'
        run: echo "EXPECTED_DEPLOY_COMMIT=${GITHUB_SHA}" >> "${GITHUB_ENV}"

      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "FAIL: GitHub Actions OIDC request URL is unavailable."; exit 1; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "FAIL: GitHub Actions OIDC request token is unavailable."; exit 1; }
          token_response="$(curl --fail-with-body --silent --show-error --get \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            --data-urlencode "audience=${GITHUB_OIDC_AUDIENCE}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "${token_response}")"
          test -n "${token}"
          printf 'GITHUB_OIDC_TOKEN=%s\n' "${token}" >> "${GITHUB_ENV}"

      - name: Verify OIDC configuration without exposing token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os
          token = os.environ["GITHUB_OIDC_TOKEN"]
          payload = token.split(".")[1] + "=" * (-len(token.split(".")[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          expected_workflow = "ykclassic/research/.github/workflows/production-market-data-verification.yml@refs/heads/main"
          assert claims.get("repository") == "ykclassic/research"
          assert claims.get("ref") == "refs/heads/main"
          assert claims.get("workflow_ref") == expected_workflow
          assert claims.get("event_name") in {"push", "schedule", "workflow_dispatch"}
          assert claims.get("aud") == "research-production-verifier"
          print("OIDC claims validated:")
          for key in ("repository", "ref", "workflow_ref", "event_name", "aud"):
              print(f"  {key}={claims[key]}")
          PY

      - name: Verify effective production database target (read-only)
        env:
          EXPECTED_DEPLOY_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail-with-body --silent --show-error "${MARKET_API_BASE}/health")"
          diagnostic="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GITHUB_OIDC_TOKEN}" \
            "${MARKET_API_BASE}/internal/diagnostics/database")"
          python - "${health}" "${diagnostic}" "${EXPECTED_DEPLOY_COMMIT}" <<'PY'
          import json
          import sys

          health = json.loads(sys.argv[1])
          diagnostic = json.loads(sys.argv[2])
          expected_commit = sys.argv[3].strip()
          expected_ref = "rprgjfvfttxydhbekuoc"

          if not diagnostic.get("configured"):
              raise SystemExit("FAIL: production database target is not configured.")
          if diagnostic.get("project_ref") != expected_ref:
              raise SystemExit("FAIL: running service targets an unexpected Supabase project.")
          if diagnostic.get("database_probe") != "ok":
              raise SystemExit("FAIL: read-only database probe failed.")
          if diagnostic.get("probe_kind") != "read_only_postgrest_billing_plans_limit_1":
              raise SystemExit("FAIL: unexpected database probe contract.")
          diagnostic_commit = diagnostic.get("deployment_commit")
          health_commit = health.get("deployment_commit")
          if not diagnostic_commit or diagnostic_commit != health_commit:
              raise SystemExit("FAIL: health and database diagnostic deployment identities differ.")
          if expected_commit and diagnostic_commit != expected_commit:
              raise SystemExit("FAIL: running service is not on the pushed commit.")

          print("PASS: effective production database target verified.")
          print(f"  project_ref={diagnostic['project_ref']}")
          print(f"  database_probe={diagnostic['database_probe']}")
          print(f"  probe_kind={diagnostic['probe_kind']}")
          print(f"  deployment_commit={diagnostic_commit}")
          PY

      # MTF is the primary candle consumer. Run it first so a successful
      # four-timeframe load populates the canonical in-memory cache; the
      # subsequent technical-analysis verification can reuse the same
      # completed candle rather than spending another Twelve Data credit.
      - name: Verify production MTF candle freshness and provenance
        run: python backend/scripts/verify_production_mtf.py

      - name: Verify deployed market-data path and fallback path
        run: python backend/scripts/verify_production_market_data.py

      - name: Verify production Enhanced Signal end-to-end
        run: |
          python backend/scripts/verify_production_enhanced_signal.py \
            --base-url "${MARKET_API_BASE}" \
            --symbol "${ENHANCED_SIGNAL_SYMBOL}" \
            --limit "${ENHANCED_SIGNAL_LIMIT}" \
            --oidc-token "${GITHUB_OIDC_TOKEN}"
      - name: Diagnose live crypto signal pipeline
        run: |
          python backend/scripts/diagnose_live_signals.py \
            --base-url "${MARKET_API_BASE}" \
            --limit "${MARKET_ANALYSIS_LIMIT}" \
            --oidc-token "${GITHUB_OIDC_TOKEN}" \
            --output live-signal-diagnostic.json

      - name: Upload live signal diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-signal-diagnostic
          path: live-signal-diagnostic.json
          if-no-files-found: ignore
