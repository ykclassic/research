name: Production Market Data Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  id-token: write

jobs:
  verify-production-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MARKET_API_BASE: https://research-76vr.onrender.com
      MARKET_SYMBOL: BTC/USD
      MARKET_TIMEFRAME: 1h
      MARKET_ANALYSIS_LIMIT: 250
      GITHUB_OIDC_AUDIENCE: research-production-verifier
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          token_response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${GITHUB_OIDC_AUDIENCE}")"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os

          response = json.loads(os.environ["TOKEN_RESPONSE"])
          token = response.get("value")
          if not token:
              raise SystemExit("GitHub OIDC provider returned no token")
          print(f"GITHUB_OIDC_TOKEN={token}")
          PY
        env:
          TOKEN_RESPONSE: ${{ steps.request-token.outputs.token_response }}

      - name: Verify deployed market-data path
        run: python backend/scripts/verify_production_market_data.py
