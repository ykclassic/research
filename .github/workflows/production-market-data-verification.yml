name: Production Market Data Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify-production-market-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MARKET_API_BASE: https://research-76vr.onrender.com
      MARKET_SYMBOL: BTC/USD
      MARKET_TIMEFRAME: 1h
      MARKET_ANALYSIS_LIMIT: 250
      MR_ACCESS_TOKEN: ${{ secrets.MR_ACCESS_TOKEN }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Verify deployed market-data path
        run: python backend/scripts/verify_production_market_data.py
