name: Branch Governance

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  phase-branch-policy:
    name: Enforce phase-branch workflow
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [[ "${BASE_REF}" != "main" ]]; then
            echo "ERROR: phase PRs must target main."
            exit 1
          fi

          if [[ "${HEAD_REF}" == "main" ]]; then
            echo "ERROR: main cannot be the source branch of a PR into main."
            exit 1
          fi

          if [[ ! "${HEAD_REF}" =~ ^phase-[0-9]+([.-][0-9]+)?-[a-z0-9][a-z0-9-]*$ ]] && [[ ! "${HEAD_REF}" =~ ^hotfix-[a-z0-9][a-z0-9-]*$ ]]; then
            echo "ERROR: source branch '${HEAD_REF}' does not follow the required naming policy."
            echo "Allowed phase form: phase-<phase>-<description>"
            echo "Allowed hotfix form: hotfix-<description>"
            exit 1
          fi

          echo "Branch policy passed: ${HEAD_REF} -> ${BASE_REF}"

  main-merge-audit:
    name: Audit main changes for PR provenance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify pushed commits are associated with merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "Initial branch creation push; provenance audit skipped."
            exit 0
          fi

          mapfile -t COMMITS < <(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
            --jq '.commits[].sha')

          if [[ ${#COMMITS[@]} -eq 0 ]]; then
            echo "No commits in the push range."
            exit 0
          fi

          for SHA in "${COMMITS[@]}"; do
            COUNT=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${REPOSITORY}/commits/${SHA}/pulls" \
              --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')

            if [[ "${COUNT}" -lt 1 ]]; then
              echo "ERROR: commit ${SHA} has no merged PR into main."
              echo "Direct commits to main are prohibited by the repository workflow."
              exit 1
            fi
          done

          echo "Main provenance audit passed for ${#COMMITS[@]} commit(s)."
