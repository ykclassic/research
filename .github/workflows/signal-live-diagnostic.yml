name: Live Signal Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-signal-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Trace live crypto signal pipeline
        run: |
          python backend/scripts/diagnose_live_signals.py \
            --base-url https://research-76vr.onrender.com \
            --limit 250 \
            --output live-signal-diagnostic.json

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-signal-diagnostic
          path: live-signal-diagnostic.json
          if-no-files-found: ignore
