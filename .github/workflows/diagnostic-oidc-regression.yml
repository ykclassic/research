name: Diagnostic and OIDC Regression Tests

on:
  pull_request:
    branches:
      - main
      - phase-1-execution-security-contract
      - test/pr252-diagnostic-oidc-hardening
    paths:
      - "backend/app/api/auth.py"
      - "backend/app/api/diagnostics.py"
      - "backend/app/config.py"
      - "backend/tests/test_auth.py"
      - "backend/tests/test_database_diagnostic.py"
      - "backend/tests/test_github_oidc_verification.py"
      - ".github/workflows/diagnostic-oidc-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run diagnostic and OIDC regression tests
        working-directory: backend
        run: |
          python -m pytest -q tests/test_database_diagnostic.py tests/test_github_oidc_verification.py tests/test_auth.py

      - name: Run full backend regression suite
        working-directory: backend
        run: python -m pytest -q
