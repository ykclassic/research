name: Production Authenticated E2E

on:
  push:
    branches:
      - reliability/production-auth-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-production-e2e:
    name: authenticated-production-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_APP_URL: https://adaptive-market-research-bot-2ok8ul.v2.appdeploy.ai
      TEST_API_URL: https://research-76vr.onrender.com
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Run authenticated production E2E
        run: npx --yes playwright@1.55.0 test e2e/authenticated-production.spec.js --reporter=line
