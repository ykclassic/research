name: Production Portfolio E2E

concurrency:
  group: production-portfolio-e2e
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-production-e2e:
    name: portfolio-production-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_API_URL: https://research-76vr.onrender.com
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_TIMEOUT_SECONDS: "60"
      RENDER_SERVICE_ID: srv-da6bkhgjo6nc73cg1big
      RENDER_DEPLOY_WAIT_TIMEOUT: "480"
      RENDER_DEPLOY_POLL_INTERVAL: "10"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check requests httpx

      - name: Wait for matching Render deployment on push
        if: github.event_name == 'push'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${RENDER_API_KEY}"
          python backend/scripts/wait_for_render_deployment.py --commit "${GITHUB_SHA}" --trigger

      - name: Run authenticated production Portfolio E2E
        run: python backend/scripts/verify_production_portfolio_e2e.py
