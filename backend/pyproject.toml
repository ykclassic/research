[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-market-research-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
